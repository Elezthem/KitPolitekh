services:
  - type: web
    name: kitsite-politekh
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
