<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Факультет | Побажання</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="screen screen-intro is-active" data-screen="intro">
        <div class="hero-card hero-card--white">
          <div class="logo-wrap" aria-label="Логотип факультету">
            <img src="/assets/logo-faculty.png" class="faculty-logo faculty-logo--bitmap" alt="Логотип факультету" />
          </div>
          <button class="primary-button" data-next="contact">Зареєструватись</button>
        </div>
      </section>

      <section class="screen" data-screen="contact">
        <form class="form-card" id="contact-form">
          <h1>Контактні дані</h1>
          <p>Введіть номер телефону, ім'я та Telegram username, щоб ми могли зв'язатися з переможцем.</p>
          <label>
            <span>Номер телефона</span>
            <input type="tel" name="phone" value="+380" placeholder="+380991112233" inputmode="tel" pattern="^\+380\d{9}$" maxlength="13" required />
          </label>
          <label>
            <span>Ім'я</span>
            <input type="text" name="name" placeholder="Ваше ім'я" pattern="^[A-Za-zА-Яа-яІіЇїЄєҐґ' -]{2,30}$" minlength="2" maxlength="30" required />
          </label>
          <label>
            <span>Юзернейм Telegram</span>
            <input type="text" name="telegram" value="@" placeholder="@username" pattern="^@?[A-Za-z0-9_]{5,32}$" minlength="5" maxlength="33" required />
          </label>
          <button type="submit" class="primary-button">Далі</button>
        </form>
      </section>

      <section class="screen" data-screen="wish">
        <form class="form-card" id="wish-form">
          <h1>Побажання факультету</h1>
          <p>Напишіть тепле побажання для факультету. Воно в реальному часі прилетить на табличку, яку тримає котик.</p>
          <label>
            <span>Ваше побажання</span>
            <textarea name="wish" rows="4" maxlength="25" minlength="2" placeholder="Бажаю факультету..." required></textarea>
          </label>
          <div class="status-line" id="form-status" aria-live="polite"></div>
          <button type="submit" class="primary-button">Відправити</button>
        </form>
      </section>

      <section class="screen screen-showcase" data-screen="showcase">
        <div class="showcase-grid">
          <aside class="qr-panel qr-panel--instagram">
            <h2>Instagram</h2>
            <div class="qr-box" id="qr-instagram"></div>
            <a class="social-link" href="https://www.instagram.com/fkitmr.zpsu/" target="_blank" rel="noreferrer">Instagram</a>
          </aside>

          <div class="cat-stage">
            <div class="wish-flyzone" id="wish-flyzone"></div>
            <div class="wish-cloud" id="wish-cloud"></div>
            <div class="cat-scene" aria-label="Котик з табличкою">
              <div class="cat-card">
                <img src="/assets/cat-board.png" class="cat-image cat-image--board" alt="Котик факультету з табличкою" />
                <div class="wish-board wish-board--embedded">
                  <div class="board-qr-box board-qr-box--single" id="qr-platform" aria-label="QR на сторінку побажань"></div>
                </div>
              </div>
            </div>
          </div>

          <aside class="qr-panel qr-panel--tiktok">
            <h2>TikTok</h2>
            <div class="qr-box" id="qr-tiktok"></div>
            <a class="social-link" href="https://www.tiktok.com/@fkitmr.zpsu" target="_blank" rel="noreferrer">TikTok</a>
          </aside>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
